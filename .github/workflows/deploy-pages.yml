name: Deploy Vite site to GitHub Pages

# GitHub Pages source: GitHub Actions
on:
  push:
    branches: [main]
    paths-ignore: ['.github/n1-sync-request.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify shared automation contract
        run: node --test scripts/n1-automation.test.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify study snapshot import
        run: |
          cp src/data/it-study-snapshot.json /tmp/study-index.json
          npm run import:study -- /tmp/study-index.json
          git diff --exit-code -- src/data/it-study-snapshot.json

      - name: Validate content
        run: npm run validate:content

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Retain exact build verification manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n1-deployment-verification
          path: dist/n1-release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Retain learning UI verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n1-learning-ui-verification
          path: /tmp/n1-improvements-playwright/**/*.png
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3

      - name: Add Pages fallbacks
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout deployment metadata
        uses: actions/checkout@v6

      - name: Setup verification Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download this run's exact build verification manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 2
        with:
          name: n1-deployment-verification
          path: /tmp/n1-deployment-verification

      - name: Verify live target date and exact release assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3; do
            if node scripts/verify-deployment.mjs --url "$PAGE_URL" --manifest /tmp/n1-deployment-verification/n1-release.json --request .github/n1-sync-request.json; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1
