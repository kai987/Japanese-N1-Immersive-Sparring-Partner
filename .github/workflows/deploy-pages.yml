name: Deploy Vite site to GitHub Pages

# GitHub Pages source: GitHub Actions
on:
  push:
    branches: [main]
    paths-ignore: ['.github/n1-sync-request.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify study snapshot import
        run: |
          cp src/data/it-study-snapshot.json /tmp/study-index.json
          npm run import:study -- /tmp/study-index.json
          git diff --exit-code -- src/data/it-study-snapshot.json

      - name: Validate content
        run: npm run validate:content

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Retain learning UI verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n1-learning-ui-verification
          path: /tmp/n1-improvements-playwright/**/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Add Pages fallbacks
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout deployment metadata
        uses: actions/checkout@v6

      - name: Verify live target date
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 <<'PY'
          import json, os, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          request = json.loads(Path('.github/n1-sync-request.json').read_text())
          target = request['targetDate']
          title = request['daily']['lesson']['title']
          base = os.environ['PAGE_URL']
          headers = {'User-Agent': 'n1-pages-live-check'}
          last_error = None

          for attempt in range(3):
              try:
                  html = urlopen(Request(base, headers=headers), timeout=20).read().decode('utf-8')
                  scripts = re.findall(r'<script[^>]+src="([^"]+\.js[^"]*)"', html)
                  if not scripts:
                      raise RuntimeError('no JavaScript bundle found on deployed page')
                  for src in scripts:
                      body = urlopen(Request(urljoin(base, src), headers=headers), timeout=20).read().decode('utf-8')
                      if target in body and title in body:
                          print(f'Live target verified: {target} / {title}')
                          raise SystemExit(0)
                  raise RuntimeError(f'target {target} not present in deployed JavaScript bundle')
              except Exception as error:
                  last_error = error
                  if attempt < 2:
                      time.sleep(5)
          raise SystemExit(f'Live target verification failed: {last_error}')
          PY
