name: Compare offline audio validators
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/n1-tool/**'
      - 'scripts/collect-audio.ts'
      - 'scripts/validate-audio.ts'
      - 'scripts/lib/audioSnapshot.ts'
      - 'src/lib/audioText.ts'
      - 'src/data/audio-*.json'
      - 'public/audio/manifest.json'
      - '.github/workflows/audio-parity.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: node --test tools/n1-tool/fixtures.test.mjs
      - run: npm run audio:compare
