name: Backfill N1 2026-09-19

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/backfill-n1-2026-09-19.yml

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download and verify upstream study snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 \
            'https://kai987.github.io/japan-it-ai-daily/study-index.json?sync=2026-09-19' \
            -o /tmp/study-index.json
          actual="$(sha256sum /tmp/study-index.json | awk '{print $1}')"
          expected='075939a2d888ef28c6d34bece3545a51438cdc3312dedeb9e386cd6101414348'
          test "$actual" = "$expected"
          curl -fsSL --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/kai987/japan-it-ai-daily/5a6bcab255126ca262be79feab8e5d31bacc7e43/src/content/japanese/2026-09-19.md' \
            -o /tmp/japanese-2026-09-19.md

      - name: Generate validated N1 daily mirror
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/generate-2026-09-19.mjs <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const date = '2026-09-19'
          const expectedCommit = '5a6bcab255126ca262be79feab8e5d31bacc7e43'
          const snapshot = JSON.parse(readFileSync('/tmp/study-index.json', 'utf8'))
          if (snapshot.sourceCommit !== expectedCommit) throw new Error(`sourceCommit mismatch: ${snapshot.sourceCommit}`)
          if (snapshot.lastDate !== date || snapshot.totalDays !== 39 || snapshot.issueNumbers?.[date] !== 39) throw new Error('Snapshot date/issue/denominator mismatch')
          if (Object.keys(snapshot.issueNumbers).length !== 39 || snapshot.issueNumbers['2026-08-12'] !== 1) throw new Error('Incomplete issue history')
          if (!snapshot.grammarLessons || Object.keys(snapshot.grammarLessons).length !== 39) throw new Error('Incomplete grammarLessons history')
          const source = readFileSync(`n1-source/${date}.md`, 'utf8')
          if (!source.includes('date: 2026-09-19') || !source.includes('day: 21') || !source.includes('# Day 21 / 99')) throw new Error('N1 source metadata mismatch')
          const p1 = 'ある開発チームでは、ユーザーの指示から直接3Dモデルを生成する一つの大きな処理を作ろうとしていた。しかし、モデルを変更するたびに全体の調整が必要になり、失敗した場合もどの段階に問題があるのか分かりにくかった。'
          const p2 = 'そこでチームは、まず画像を生成し、その画像を検証したうえで3D化する二段階の構成に変更した。画像生成モデルと3D生成モデルを別々に交換できるようにし、各段階の結果も保存するようにした。その結果、品質に問題が起きたときに原因を特定しやすくなり、新しいモデルも一部だけ差し替えて試せるようになった。'
          if (!source.includes(p1) || !source.includes(p2)) throw new Error('N1 reading source changed')
          const upstream = readFileSync('/tmp/japanese-2026-09-19.md', 'utf8')
          const wantedWords = ['抜け漏れ','固める','補助的','波及','即時性','整合性','偏り','成し遂げる','多面的','掛け合わせる']
          const wantedGrammar = ['～に向けて','～をはじめとする']
          if (!upstream.includes('**10词：** 抜け漏れ・固める・補助的・波及・即時性・整合性・偏り・成し遂げる・多面的・掛け合わせる') || !upstream.includes('**2语法：** ～に向けて・～をはじめとする')) throw new Error('Upstream C-4 selection mismatch')
          const sourceLesson = snapshot.lessons?.[date]
          if (!sourceLesson || sourceLesson.issueNumber !== 39) throw new Error('Missing upstream lesson 39')
          const vocabulary = wantedWords.map((word, index) => {
            const card = sourceLesson.vocabulary.find((item) => item.studyKind === 'new' && item.term === word)
            if (!card) throw new Error(`Missing C-4 vocabulary: ${word}`)
            return {
              id: `${date}-v-${String(index + 1).padStart(3,'0')}`,
              word: card.term,
              reading: card.reading,
              meaning: card.meaning,
              jlpt: card.level,
              partOfSpeech: card.partOfSpeech,
              example: card.exampleJa,
              translation: card.exampleMeaning,
              collocations: card.collocations,
              nuance: card.nuance ?? card.note,
            }
          })
          const register = {
            '～に向けて': '技術文書・ビジネス文章',
            '～をはじめとする': '正式な説明・技術文書',
          }
          const grammar = wantedGrammar.map((pattern, index) => {
            const card = sourceLesson.grammar.find((item) => item.studyKind === 'new' && item.pattern === pattern)
            if (!card) throw new Error(`Missing C-4 grammar: ${pattern}`)
            return {
              id: `${date}-g-${String(index + 1).padStart(3,'0')}`,
              pattern: card.pattern,
              meaning: card.meaning,
              form: card.structure,
              register: register[pattern],
              frequency: 3,
              explanation: card.usage,
              example: card.exampleJa,
              translation: card.exampleMeaning,
              comparison: card.note,
              level: card.level,
              sourceUrl: card.sourceUrl,
              sourceForm: card.sourceForm,
              sourceAnchor: card.sourceAnchor,
            }
          })
          const entry = {
            lesson: {
              date,
              day: 21,
              title: '複数のAIモデルやツールを組み合わせる設計',
              subtitle: '処理を段階に分け、各段階を独立して検証・交換できる構成を考える',
              estimatedMinutes: 35,
              immersion: {
                title: '一つの大きな処理を、検証可能な段階へ分ける',
                paragraphs: [p1, p2],
                translations: [
                  '某开发团队原本想构建一个从用户指令直接生成3D模型的大型单一处理流程。但每次更换模型都需要重新调整整个流程，而且发生失败时也难以判断问题出在哪个阶段。',
                  '于是团队改为两阶段：先生成图片、验证图片，再进行3D化。图像生成模型与3D生成模型可以分别替换，并保存各阶段结果。这样出现质量问题时更容易定位原因，也可以只替换其中一部分模型进行尝试。'
                ],
                analysis: [
                  '第一段说明单体流程的问题：模型替换会牵动整体调整，而且失败点难以定位。重点是可替换性和可观察性不足。',
                  '第二段用「そこで」引出分阶段方案：把生成、验证、3D化拆开，使每个阶段能独立交换、保存结果并定位质量问题。'
                ]
              },
              vocabulary,
              grammar,
              grammarSelectionNote: '全历史Grammar identity与当天Top 5原文逐项核对后，仅确认2个符合原文证据、N1/N2学习价值且尚未收录的新增文型；不为凑到5～8项重复旧文型。网页与推送中的复习区由learning-review共享模块从既习项按当天真实用例补充。',
              grammarSourceCommit: expectedCommit,
              reading: {
                title: '二段階構成へ変更した理由',
                paragraphs: [p1, p2],
                question: {
                  id: `${date}-q-main`,
                  prompt: 'このチームが処理を二段階に分けた主な理由は何か。',
                  options: [
                    '一つのモデルしか利用できないようにするため。',
                    '各段階を独立して検証・交換でき、問題の原因も特定しやすくするため。',
                    '画像生成を完全に廃止するため。',
                    '3Dモデルの生成時間を必ずゼロにするため。'
                  ],
                  answer: 1,
                  explanation: '本文は、段階を分けることで各モデルを別々に交換でき、各段階の結果を保存して問題の原因を特定しやすくしたと述べている。',
                  optionNotes: [
                    '本文は利用モデルを一つに限定するのではなく、段階ごとに交換できるようにしている。',
                    '独立した検証・交換と原因特定のしやすさという本文の目的をまとめている。',
                    '画像生成は廃止されず、むしろ第一段階として利用されている。',
                    '生成時間をゼロにすることは本文の目的ではない。'
                  ]
                }
              }
            },
            reviewFocus: [
              { type: '文法', title: '今日の錯題 Q1｜～なくしては', detail: '必要条件を強く表す用法を、AIシステム運用の文脈で再確認する。答えはここでは表示しない。' },
              { type: '文法', title: '今日の錯題 Q2｜～とするには', detail: 'ある目標を実現するために必要な条件を述べる用法を再確認する。答えはここでは表示しない。' },
              { type: '词汇', title: '今日の錯題 Q3｜管轄', detail: '部署や組織が業務・システムを担当し管理する意味と用法を復習する。' },
              { type: '词汇', title: '今日の錯題 Q4｜互角', detail: '二者の能力や品質がほぼ同程度である意味を、モデル比較の文脈で復習する。' },
              { type: '读解', title: '今日の錯題 Q5｜二段階構成へ変更した理由', detail: '問題点→構成変更→得られた効果の流れを追い、導入理由を本文の根拠と結び付ける。正解はここでは表示しない。' }
            ],
            merged: false
          }
          writeFileSync('/tmp/2026-09-19.json', JSON.stringify(entry, null, 2) + '\n')
          NODE
          node /tmp/generate-2026-09-19.mjs
          npm run import:daily -- /tmp/2026-09-19.json
          npm run import:study -- /tmp/study-index.json

      - name: Validate content
        run: npm run validate:content

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Commit synchronized files
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- n1-source/2026-09-19.md
          git config user.name 'Kai'
          git config user.email '65030330+kai987@users.noreply.github.com'
          git add src/data/daily/2026-09-19.json src/data/it-study-snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m 'content: sync N1 daily 2026-09-19'
          git push origin HEAD:main
