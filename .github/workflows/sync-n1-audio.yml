name: Sync shared N1 audio

on:
  workflow_run:
    workflows: ['Deploy Vite site to GitHub Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional published N1 lesson date (YYYY-MM-DD)
        required: false
      source_audio_commit:
        description: Optional exact successful upstream R2 commit (40 hex)
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: n1-content-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check publication trigger
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_RUN_ID: ${{ github.event.workflow_run.id }}
          PAGES_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAGES_RUN_ID/attempts/$PAGES_RUN_ATTEMPT/jobs?per_page=100")
          verified=$(printf '%s' "$jobs" | jq -er '.jobs[] | select(.name == "deploy" and .conclusion == "success") | .steps[] | select(.name == "Verify live target date and exact release assets") | .conclusion')
          test "$verified" = success
          deployed=$(printf '%s' "$jobs" | jq -er '.jobs[] | select(.name == "deploy" and .conclusion == "success") | .steps[] | select(.name == "Deploy to GitHub Pages") | .conclusion')
          case "$deployed" in
            success) echo "execute=true" >> "$GITHUB_OUTPUT" ;;
            skipped)
              echo "execute=false" >> "$GITHUB_OUTPUT"
              echo "Verified unchanged release; no new Pages deployment, no audio sync needed." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "Unverified Pages deployment" >&2; exit 1 ;;
          esac

      - name: Checkout current N1 main
        if: steps.publication.outputs.execute == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
          path: n1

      - name: Lock a successful upstream R2 audio commit
        if: steps.publication.outputs.execute == 'true'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ inputs.source_audio_commit }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const requested = process.env.REQUESTED_COMMIT || '';
          if (requested && !/^[a-f0-9]{40}$/.test(requested)) throw new Error('Invalid audio commit');
          const query = 'repos/kai987/japan-it-ai-daily/actions/workflows/sync-r2-audio.yml/runs?branch=main&status=success&per_page=100' + (requested ? '&head_sha=' + requested : '');
          const { workflow_runs: runs } = JSON.parse(execFileSync('gh', ['api', query, '--jq', '{workflow_runs: [.workflow_runs[] | {head_sha, head_branch, status, conclusion, path, head_repository: {full_name: .head_repository.full_name}, html_url}]}'], { encoding: 'utf8' }));
          const run = runs.find(r => r.head_branch === 'main' && r.status === 'completed' && r.conclusion === 'success' && r.path === '.github/workflows/sync-r2-audio.yml' && r.head_repository?.full_name === 'kai987/japan-it-ai-daily' && (!requested || r.head_sha === requested));
          if (!run) throw new Error('waiting_daily_audio: no matching successful upstream R2 run');
          appendFileSync(process.env.GITHUB_OUTPUT, `commit=${run.head_sha}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Upstream audio: ${run.html_url}\n`);
          NODE

      # Fetch metadata only; shared MP3s stay on R2.
      - name: Checkout pinned upstream audio manifests
        if: steps.publication.outputs.execute == 'true'
        uses: actions/checkout@v6
        with:
          repository: kai987/japan-it-ai-daily
          ref: ${{ steps.source.outputs.commit }}
          path: daily
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/audio/japanese/**/manifest.json
            /public/audio/japanese/**/interview-manifest.json

      - name: Setup Node
        if: steps.publication.outputs.execute == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        if: steps.publication.outputs.execute == 'true'
        working-directory: n1
        run: npm ci --no-audit --no-fund

      - name: Plan shared audio candidates
        if: steps.publication.outputs.execute == 'true'
        id: plan
        working-directory: n1
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          plan=$(node scripts/sync-audio.ts --daily-repo ../daily --ref "$SOURCE_COMMIT" --date "$TARGET_DATE" --plan-only)
          needed=$(printf '%s' "$plan" | jq -er '.needed | select(type == "number" and . >= 0 and floor == .)')
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "New shared recordings to inspect: $needed" >> "$GITHUB_STEP_SUMMARY"

      - name: Install audio inspection tools
        if: steps.plan.outputs.needed != '0' && steps.publication.outputs.execute == 'true'
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Verify and merge shared audio, record pending utterances
        if: steps.publication.outputs.execute == 'true'
        shell: bash
        working-directory: n1
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          status=0
          npm run audio:sync -- --daily-repo ../daily --ref "$SOURCE_COMMIT" --date "$TARGET_DATE" | tee "$RUNNER_TEMP/n1-audio-sync.log" || status=$?
          cat "$RUNNER_TEMP/n1-audio-sync.log" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Check for audio metadata changes
        if: steps.publication.outputs.execute == 'true'
        id: metadata
        working-directory: n1
        run: |
          changed=$(git diff --no-renames --name-only HEAD --)
          if [ -z "$changed" ]; then
            echo 'Audio metadata is unchanged.' >> "$GITHUB_STEP_SUMMARY"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            node scripts/verify-audio-changed-paths.ts "$changed"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Capture candidate audio tree
        if: steps.metadata.outputs.changed == 'true'
        working-directory: n1
        run: node scripts/validated-build.mjs capture --audio --output "$RUNNER_TEMP/n1-validated-audio-source.json"

      - name: Typecheck
        if: steps.metadata.outputs.changed == 'true'
        working-directory: n1
        run: npm run typecheck

      - name: Verify study snapshot import
        if: steps.metadata.outputs.changed == 'true'
        working-directory: n1
        run: |
          cp src/data/it-study-snapshot.json "$RUNNER_TEMP/n1-audio-study.json"
          npm run import:study -- "$RUNNER_TEMP/n1-audio-study.json"
          cmp "$RUNNER_TEMP/n1-audio-study.json" src/data/it-study-snapshot.json

      - name: Validate content
        if: steps.metadata.outputs.changed == 'true'
        working-directory: n1
        run: npm run validate:content

      - name: Validate audio snapshot, content and unit contracts
        if: steps.metadata.outputs.changed == 'true'
        working-directory: n1
        run: |
          npm run audio:validate -- --snapshot
          npm test
          npm run build:ci
          git diff --check

      - name: Commit audio metadata with fast-forward protection
        if: steps.metadata.outputs.changed == 'true'
        id: commit
        working-directory: n1
        run: |
          base=$(git rev-parse HEAD)
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$base"
          git add public/audio/manifest.json src/data/audio-index.json src/data/audio-sources.json src/data/audio-pending.json
          if ! git diff --cached --quiet; then
            node scripts/verify-audio-changed-paths.ts "$(git diff --cached --name-only)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "content: sync verified shared N1 audio"
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Seal validated build for Pages
        if: steps.commit.outputs.changed == 'true'
        id: seal
        continue-on-error: true
        working-directory: n1
        run: node scripts/validated-build.mjs seal --capture "$RUNNER_TEMP/n1-validated-audio-source.json" --output "$RUNNER_TEMP/n1-validated-audio-pages"

      - name: Retain validated Pages build
        if: steps.commit.outputs.changed == 'true' && steps.seal.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n1-validated-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n1-validated-audio-pages
          if-no-files-found: error
          retention-days: 7

      - name: Deploy changed audio metadata
        if: steps.commit.outputs.changed == 'true'
        working-directory: n1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f "validated_run_id=$GITHUB_RUN_ID"
