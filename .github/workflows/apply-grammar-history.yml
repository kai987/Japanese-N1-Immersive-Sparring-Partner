name: Apply and verify historical grammar sync
on:
  push:
    branches: [feat/grammar-history-sync-2026-09-18]
    paths: [.github/workflows/apply-grammar-history.yml]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/grammar-history-sync-2026-09-18
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Apply checksum-verified code patch
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          patch=gzip.decompress(base64.b64decode(pathlib.Path('.github/grammar-history.patch.b64').read_text().strip(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='87bb2e95ebe283566322abd3d346a500f9bea5c8c081263d9754a2b82e9cfeb0', 'Patch checksum mismatch'
          path=pathlib.Path('/tmp/n1-grammar.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(path)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(path)],check=True)
          PY
      - name: Read the exact published IT snapshot
        run: |
          python3 - <<'PY'
          import urllib.request,json,time,pathlib
          expected='357c579a44ac0ba0f2fc2e7687ef7602e07ff488'
          url='https://kai987.github.io/japan-it-ai-daily/study-index.json?source='+expected
          for attempt in range(12):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'N1-grammar-sync','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as response: raw=response.read()
                  data=json.loads(raw)
                  assert data['sourceCommit']==expected, 'Published snapshot is still an older commit'
                  assert sorted(data['grammarLessons'])==sorted(data['issueNumbers']), 'Historical grammar dates are incomplete'
                  assert data['policy']['grammarMinimum']==5 and data['policy']['grammarMaximum']==8
                  pathlib.Path('/tmp/study-index.json').write_bytes(raw)
                  print('Verified published source:',expected,'reports:',data['totalDays'])
                  break
              except Exception as exc:
                  print('Snapshot read attempt',attempt+1,type(exc).__name__,str(exc))
                  if attempt==11: raise
                  time.sleep(15)
          PY
      - run: npm ci --no-audit --no-fund
      - name: Import and validate snapshot
        run: |
          npm run import:study -- /tmp/study-index.json
          npm run validate:content
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Retain UI verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n1-grammar-history-ui
          path: /tmp/n1-improvements-playwright/**/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit verified source and remove temporary transfer files
        run: |
          git rm .github/grammar-history.patch.b64 .github/workflows/apply-grammar-history.yml
          git add src/lib/itStudy.ts tests/study-review.test.ts tests/study-review.spec.ts src/data/it-study-snapshot.json
          git diff --cached --stat
          git config user.name 'Kai'
          git config user.email '65030330+kai987@users.noreply.github.com'
          git commit -m 'feat: sync historical grammar review with flexible 5–8 counts'
          git push origin HEAD:feat/grammar-history-sync-2026-09-18
