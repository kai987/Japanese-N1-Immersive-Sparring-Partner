[package]
name = "n1-tool"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = {version = "0.4", default-features = false, features = ["std"]}
clap = {version = "4", features = ["derive"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1", features = ["float_roundtrip"]}
sha2 = "0.10"
url = "2"
