<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>N1 Pages Health Check</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f3;color:#202522;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif}
    main{width:min(620px,calc(100% - 40px));box-sizing:border-box;padding:32px;border:1px solid #dfe4df;border-radius:16px;background:#fffefa}
    h1{margin:0 0 12px;font-size:24px}p{margin:8px 0;line-height:1.8;color:#58615b}.ok{color:#477b70;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>N1 Pages Health Check</h1>
    <p class="ok">GitHub Pages の静的HTMLは正常に配信されています。</p>
    <p>このページが見える場合、ドメインとPages配信は正常です。メイン画面だけ見えない場合は、ブラウザ側のJavaScript/CSS読み込みを確認できます。</p>
    <p>Deployment: pages-fallback-v1</p>
  </main>
</body>
</html>
